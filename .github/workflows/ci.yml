name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: services/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # tests/test_household_isolation.py braucht ein echtes lokales
      # Supabase (Auth + RLS) - siehe services/api/tests/conftest.py fuer
      # die erwarteten Standard-Ports/-Zugangsdaten.
      - working-directory: supabase
        run: supabase start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements-dev.txt
      - working-directory: services/api
        run: pip install -r requirements-dev.txt
      - working-directory: services/api
        run: ruff check .
      - working-directory: services/api
        run: mypy app
      - working-directory: services/api
        run: pytest -q
      - if: always()
        working-directory: supabase
        run: supabase stop

  worker:
    name: services/worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Ein Teil der Worker-Tests spricht - wie die API-Tests - gegen ein
      # echtes lokales Supabase (Importlauf, Dokumentauswertung, Ablage).
      # Ohne diesen Schritt scheitert pytest reihenweise an
      # "connection refused" auf 127.0.0.1:55322, und zwar unabhaengig davon,
      # ob der Code stimmt.
      - working-directory: supabase
        run: supabase start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy worker
      - run: pytest -q
      - if: always()
        working-directory: supabase
        run: supabase stop

  web-and-mobile:
    name: apps + packages (Node)
    runs-on: ubuntu-latest
    env:
      # src/lib/supabase.ts legt den Client beim Modulimport an; supabase-js
      # wirft bei leerer URL "supabaseUrl is required". Testdateien, die den
      # AuthProvider importieren, ohne das Modul zu mocken, scheitern sonst
      # schon beim Laden. Lokal kommen die Werte aus der .env, hier nicht -
      # deshalb dieselben oeffentlichen Demo-Werte wie im e2e-Job.
      VITE_SUPABASE_URL: http://127.0.0.1:55321
      VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22, nicht 20: jsdom 30 zieht undici 8 nach, das
          # webidl.util.markAsUncloneable braucht - unter Node 20 bricht
          # der vitest-Worker beim Start ab, noch bevor ein Test laeuft.
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e-web:
    name: apps/web E2E (Playwright)
    runs-on: ubuntu-latest
    # Erster Playwright-Lauf ueberhaupt in diesem Repo - laeuft vorerst nur
    # informativ mit, bis er sich als stabil erwiesen hat (siehe Plan).
    continue-on-error: true
    # app.main importiert transitiv app.api.v1.routes.imports -> worker.actors,
    # dessen setup_broker() im uvicorn-Prozess den echten Redis-Broker
    # konfiguriert (siehe services/worker/worker/broker.py) - deshalb hier ein
    # echter, wenn auch von den E2E-Tests inhaltlich ungenutzter, Redis-Service.
    # Der "api"-Job braucht ihn bewusst NICHT: services/api/tests/conftest.py
    # setzt vorher einen In-Process-StubBroker, an den sich die Actors binden
    # und der sie im Testprozess auch tatsaechlich abarbeitet. Ein echter Redis
    # waere dort sogar schaedlich - die Nachrichten landeten in einer Queue,
    # die im CI niemand konsumiert, und die Import-Assertions liefen gegen
    # unverarbeitete Daten.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SUPABASE_URL: http://127.0.0.1:55321
      # Oeffentlicher lokaler Supabase-CLI-Demo-Anon-Key (siehe .env.example),
      # kein echtes Secret.
      VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Playwright-Tests brauchen ein echtes lokales Supabase (Auth + RLS) -
      # es gibt keinen sinnvollen Fake fuer den Login-Flow, siehe "api"-Job.
      - working-directory: supabase
        run: supabase start

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements-dev.txt
      - working-directory: services/api
        run: pip install -r requirements-dev.txt
      - name: Start FastAPI backend
        working-directory: services/api
        env:
          # Gleiche Werte wie services/api/tests/conftest.py (dort per
          # os.environ.setdefault fuer pytest) bzw. .env.example (lokaler
          # Supabase-CLI-Demo-Wert, kein echtes Secret) - hier explizit
          # gesetzt, weil dieser Prozess (uvicorn statt pytest) conftest.py
          # nie laedt.
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:55322/postgres"
          SUPABASE_URL: http://127.0.0.1:55321
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          SUPABASE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
          REDIS_URL: "redis://localhost:6379/0"
          API_CORS_ORIGINS: "http://localhost:5173"
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/system/health && exit 0
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22, nicht 20: jsdom 30 zieht undici 8 nach, das
          # webidl.util.markAsUncloneable braucht - unter Node 20 bricht
          # der vitest-Worker beim Start ab, noch bevor ein Test laeuft.
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

      - if: always()
        working-directory: supabase
        run: supabase stop
