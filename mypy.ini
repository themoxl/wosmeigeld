# Mypy-Konfiguration fuer Aufrufe aus dem Repo-Root heraus, z.B.
#
#   ./services/api/.venv/Scripts/python.exe -m mypy services/api/app
#   ./services/worker/.venv/Scripts/python.exe -m mypy services/worker/worker
#
# Mypy sucht seine Konfiguration ausschliesslich im aktuellen
# Arbeitsverzeichnis (mypy.ini, .mypy.ini, pyproject.toml, setup.cfg) und
# NICHT in uebergeordneten Verzeichnissen. Ohne diese Datei fand ein
# Root-Aufruf gar keine Konfiguration und lief damit still mit den
# Standardwerten - also OHNE strict und OHNE ignore_missing_imports. Das war
# doppelt irrefuehrend: der Lauf meldete vier falsche import-not-found-Fehler
# fuer die service-uebergreifenden worker.*-Importe in
# app/api/v1/routes/{imports,ai}.py und pruefte gleichzeitig deutlich
# schwaecher als die CI.
#
# Die Werte sind bewusst identisch zu [tool.mypy] in
# services/api/pyproject.toml und services/worker/pyproject.toml. Die CI ruft
# mypy mit working-directory services/api bzw. services/worker auf und nutzt
# daher weiterhin die jeweilige pyproject.toml - diese Datei aendert daran
# nichts, sie macht nur den Root-Aufruf gleichwertig.
[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True
